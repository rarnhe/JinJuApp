name: Native XAML experiment
on:
  pull_request:
    branches: [main]
    paths-ignore: ['test_report.md', 'tests/*.exe', 'tests/*.dll', 'tests/*.sha256']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Clean previous binaries
        run: |
          foreach ($name in @('JinJuApp.exe','JinJuXaml.dll','JinJuXamlUnload.exe','JinJuMarquee.exe')) {
            Remove-Item "tests/$name","tests/$name.sha256" -Force -ErrorAction SilentlyContinue
          }
      - name: Configure and compile all targets
        id: build
        run: |
          cmake -S . -B out/build/x64-release -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/build/x64-release --config Release
          exit $LASTEXITCODE
      - name: Test
        id: test
        run: |
          ctest --test-dir out/build/x64-release -C Release --output-on-failure --no-tests=error
          exit $LASTEXITCODE
      - name: Verify delivery
        id: copy
        run: |
          foreach ($name in @('JinJuApp.exe','JinJuXaml.dll','JinJuXamlUnload.exe','JinJuMarquee.exe')) {
            $actual = (Get-FileHash "tests/$name").Hash
            $expected = ((Get-Content "tests/$name.sha256") -split '\s+')[0]
            if ($actual -ne $expected) { throw "Delivery hash mismatch: $name" }
          }
      - name: Report
        if: always()
        run: |
          @('# Native XAML test report','', 'Build: ${{ steps.build.outcome }}','CTest: ${{ steps.test.outcome }}','Copy: ${{ steps.copy.outcome }}','Source: ${{ github.event.pull_request.head.sha }}','Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}','Live Explorer visual test: not performed') | Set-Content test_report.md
          Get-Content test_report.md >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: native-xaml-release
          path: |
            tests/JinJuApp.exe
            tests/JinJuXaml.dll
            tests/JinJuXamlUnload.exe
            tests/JinJuMarquee.exe
            tests/*.sha256
            test_report.md
      - name: Publish report and binaries
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE: ${{ github.event.pull_request.head.sha }}
          TEST: ${{ steps.test.outcome }}
          COPY: ${{ steps.copy.outcome }}
        run: |
          git fetch origin "refs/heads/$env:BRANCH"
          if ($LASTEXITCODE -or (git rev-parse FETCH_HEAD) -ne $env:SOURCE) { throw 'Stale source' }
          git reset --soft $env:SOURCE
          git add test_report.md
          if ($env:TEST -eq 'success' -and $env:COPY -eq 'success') {
            git add -f tests/JinJuApp.exe tests/JinJuXaml.dll tests/JinJuApp.exe.sha256 tests/JinJuXaml.dll.sha256 tests/JinJuXamlUnload.exe tests/JinJuXamlUnload.exe.sha256 tests/JinJuMarquee.exe tests/JinJuMarquee.exe.sha256
          } else {
            git rm -f --ignore-unmatch tests/JinJuApp.exe tests/JinJuXaml.dll tests/JinJuApp.exe.sha256 tests/JinJuXaml.dll.sha256 tests/JinJuXamlUnload.exe tests/JinJuXamlUnload.exe.sha256 tests/JinJuMarquee.exe tests/JinJuMarquee.exe.sha256
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: publish XAML experiment [skip ci]'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push origin "HEAD:refs/heads/$env:BRANCH"
          exit $LASTEXITCODE
