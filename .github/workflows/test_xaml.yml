name: Native XAML experiment
on:
  pull_request:
    branches: [main]
    paths: ['xaml_experiment/**', 'tests/test_xaml.cpp', '.github/workflows/test_xaml.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Configure and compile
        id: build
        run: |
          cmake -S xaml_experiment -B out/build/xaml-release -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/build/xaml-release --config Release
          exit $LASTEXITCODE
      - name: Test
        id: test
        run: |
          ctest --test-dir out/build/xaml-release -C Release --output-on-failure
          exit $LASTEXITCODE
      - name: Copy verified binaries
        if: success()
        run: |
          Copy-Item out/build/xaml-release/Release/JinJuApp.exe, out/build/xaml-release/Release/JinJuXaml.dll tests/ -Force
          Get-FileHash tests/JinJuApp.exe,tests/JinJuXaml.dll
      - name: Report
        if: always()
        run: |
          @('# Native XAML test report','', 'Build: ${{ steps.build.outcome }}','CTest: ${{ steps.test.outcome }}','Live Explorer visual test: not performed') | Set-Content test_report.md
          Get-Content test_report.md >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: native-xaml-release
          path: |
            tests/JinJuApp.exe
            tests/JinJuXaml.dll
            test_report.md
      - name: Publish report and binaries
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE: ${{ github.event.pull_request.head.sha }}
          TEST: ${{ steps.test.outcome }}
        run: |
          git fetch origin "refs/heads/$env:BRANCH"
          if ($LASTEXITCODE -or (git rev-parse FETCH_HEAD) -ne $env:SOURCE) { throw 'Stale source' }
          git reset --soft $env:SOURCE
          git add test_report.md
          git rm --ignore-unmatch tests/JinJuApp.exe.sha256
          if ($env:TEST -eq 'success' -and (Test-Path tests/JinJuXaml.dll)) {
            git add -f tests/JinJuApp.exe tests/JinJuXaml.dll
          } else {
            git rm -f --ignore-unmatch tests/JinJuApp.exe tests/JinJuXaml.dll
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: publish XAML experiment [skip ci]'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push origin "HEAD:refs/heads/$env:BRANCH"
          exit $LASTEXITCODE
